<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-canvas" width="256" height="184" viewBox="0 0 256 184"><style>

/* ── #lochmara (lochmara) ── */
@keyframes lochmara--opacity {
       0% { opacity: 0.0000; }
      28% { opacity: 0.0000; }
      32% { opacity: 100.0000; }
      70% { opacity: 100.0000; }
      74% { opacity: 0.0000; }
     100% { opacity: 0.0000; }
}
#lochmara {
  transform-box    : fill-box;
  transform-origin : 50% 50%;
  animation        : lochmara--opacity 2.5s linear infinite;
}

/* ── #red (red) ── */
@keyframes red--opacity {
       0% { opacity: 0.0000; }
      24% { opacity: 0.0000; }
      28% { opacity: 100.0000; }
      74% { opacity: 100.0000; }
      78% { opacity: 0.0000; }
     100% { opacity: 0.0000; }
}
#red {
  transform-box    : fill-box;
  transform-origin : 50% 50%;
  animation        : red--opacity 2.5s linear infinite;
}

/* ── #blaze_orange (blaze_orange) ── */
@keyframes blaze_orange--opacity {
       0% { opacity: 0.0000; }
      20% { opacity: 0.0000; }
      24% { opacity: 100.0000; }
      78% { opacity: 100.0000; }
      82% { opacity: 0.0000; }
     100% { opacity: 0.0000; }
}
#blaze_orange {
  transform-box    : fill-box;
  transform-origin : 50% 50%;
  animation        : blaze_orange--opacity 2.5s linear infinite;
}

/* ── #lightning_yellow (lightning_yellow) ── */
@keyframes lightning_yellow--opacity {
       0% { opacity: 0.0000; }
      16% { opacity: 0.0000; }
      20% { opacity: 1000.0000; }
      82% { opacity: 1000.0000; }
      86% { opacity: 0.0000; }
     100% { opacity: 0.0000; }
}
#lightning_yellow {
  transform-box    : fill-box;
  transform-origin : 50% 50%;
  animation        : lightning_yellow--opacity 2.5s linear infinite;
}

/* ── #malachite (malachite) ── */
@keyframes malachite--opacity {
       0% { opacity: 0.0000; }
      12% { opacity: 0.0000; }
      16% { opacity: 100.0000; }
      86% { opacity: 100.0000; }
      90% { opacity: 0.0000; }
     100% { opacity: 0.0000; }
}
#malachite {
  transform-box    : fill-box;
  transform-origin : 50% 50%;
  animation        : malachite--opacity 2.5s linear infinite;
}

</style>












